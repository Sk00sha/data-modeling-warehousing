name: 'data_warehouse'
version: '1.0.0'
config-version: 2

profile: 'warehouse'

model-paths: ["models"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
test-paths: ["tests"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # First order_date in the seed data range. Used to build the date dimension.
  # See models/marts/dim_date.sql
  date_spine_start: "2023-01-01"

models:
  data_warehouse:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  data_warehouse:
    +schema: seeds
